<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مدیورا</title>
<meta name="description" content="مدیورا؛ دستیار هوشمند سلامت شما">
<meta name="theme-color" content="#0b4fc4">
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root {
  --bg: #f0f4fa;
  --card: #ffffff;
  --tx: #0f172a;
  --mut: #64748b;
  --pri: #2563eb;
  --pri2: #1d4ed8;
  --pri-soft: rgba(37, 99, 235, 0.12);
  --bd: #e2e8f0;
  --sh: 0 4px 24px rgba(15, 23, 42, 0.06);
  --sh-lg: 0 12px 40px rgba(15, 23, 42, 0.1);
  --radius: 22px;
  --radius-sm: 16px;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1220;
    --card: #131c2e;
    --tx: #f1f5f9;
    --mut: #94a3b8;
    --pri: #60a5fa;
    --pri2: #3b82f6;
    --pri-soft: rgba(96, 165, 250, 0.15);
    --bd: #1e293b;
    --sh: 0 4px 24px rgba(0, 0, 0, 0.35);
    --sh-lg: 0 12px 40px rgba(0, 0, 0, 0.45);
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg: #0b1220;
  --card: #131c2e;
  --tx: #f1f5f9;
  --mut: #94a3b8;
  --pri: #60a5fa;
  --pri2: #3b82f6;
  --pri-soft: rgba(96, 165, 250, 0.15);
  --bd: #1e293b;
  --sh: 0 4px 24px rgba(0, 0, 0, 0.35);
  --sh-lg: 0 12px 40px rgba(0, 0, 0, 0.45);
  color-scheme: dark;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  height: 100%;
}

body {
  background: var(--bg);
  color: var(--tx);
  font-family: Tahoma, "Vazirmatn", system-ui, -apple-system, sans-serif;
  display: flex;
  flex-direction: column;
  max-width: 560px;
  margin: auto;
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

main {
  flex: 1;
  overflow: auto;
  padding: 0 18px 110px;
  scroll-behavior: smooth;
}

main > * {
  animation: fadeUp 0.4s cubic-bezier(0.22, 1, 0.36, 1) both;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: none; }
}

/* Header */
.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 0 14px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand svg {
  width: 46px;
  height: 46px;
  filter: drop-shadow(0 6px 12px rgba(37, 99, 235, 0.35));
}

.brand b {
  font-size: 22px;
  letter-spacing: 0.3px;
  display: block;
  line-height: 1.1;
  font-weight: 700;
}

.brand small {
  color: var(--mut);
  font-size: 11px;
  letter-spacing: 3.5px;
  font-weight: 500;
}

.ib {
  width: 44px;
  height: 44px;
  border-radius: 16px;
  background: var(--card);
  box-shadow: var(--sh);
  display: grid;
  place-items: center;
  position: relative;
  color: var(--pri);
  padding: 0;
  border: 1px solid var(--bd);
  transition: transform 0.15s;
}

.ib:active { transform: scale(0.94); }

.ib i {
  position: absolute;
  top: 9px;
  left: 10px;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #ef4444;
  border: 2px solid var(--card);
}

/* Cards */
.card {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: var(--radius);
  padding: 18px;
  margin-bottom: 14px;
  box-shadow: var(--sh);
  transition: transform 0.2s, box-shadow 0.2s;
}

.card:active {
  transform: scale(0.985);
}

/* Hero */
.hero {
  background: linear-gradient(145deg, #0f2b5b 0%, #1e4d9c 45%, #3b82f6 100%);
  color: #fff;
  border: 0;
  position: relative;
  overflow: hidden;
  padding: 24px 20px;
  box-shadow: 0 16px 40px rgba(37, 99, 235, 0.28);
}

.hero:before,
.hero:after {
  content: "";
  position: absolute;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.07);
}

.hero:before {
  width: 180px;
  height: 180px;
  left: -55px;
  top: -65px;
}

.hero:after {
  width: 120px;
  height: 120px;
  right: -35px;
  bottom: -45px;
}

.hero > * { position: relative; }

.ecg {
  position: absolute !important;
  left: 0;
  right: 0;
  bottom: 10px;
  opacity: 0.22;
  width: 100%;
  height: 42px;
}

.pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  background: rgba(255, 255, 255, 0.16);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-radius: 30px;
  padding: 7px 14px;
  font-size: 13px;
  font-weight: 500;
  border: 1px solid rgba(255, 255, 255, 0.12);
}

.row {
  display: flex;
  gap: 10px;
  align-items: center;
  justify-content: space-between;
}

/* Quick actions grid */
.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 16px;
}

.q {
  text-align: center;
  cursor: pointer;
  padding: 18px 8px;
  font-size: 13px;
  font-weight: 500;
  margin: 0;
  transition: transform 0.18s;
}

.q:active { transform: scale(0.94); }

.tile {
  width: 56px;
  height: 56px;
  border-radius: 20px;
  margin: 0 auto 10px;
  display: grid;
  place-items: center;
  color: #fff;
  background: linear-gradient(145deg, #60a5fa, #2563eb);
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.32);
}

.tile.t2 {
  background: linear-gradient(145deg, #34d399, #059669);
  box-shadow: 0 10px 20px rgba(5, 150, 105, 0.3);
}

.tile.t3 {
  background: linear-gradient(145deg, #a78bfa, #7c3aed);
  box-shadow: 0 10px 20px rgba(124, 58, 237, 0.3);
}

/* Buttons */
button {
  font: inherit;
  cursor: pointer;
  border: 0;
  border-radius: 16px;
  padding: 12px 18px;
  background: linear-gradient(135deg, var(--pri), var(--pri2));
  color: #fff;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  justify-content: center;
  transition: transform 0.15s, box-shadow 0.15s;
  box-shadow: 0 6px 16px rgba(37, 99, 235, 0.28);
  font-weight: 600;
}

button:active {
  transform: scale(0.96);
}

button.g {
  background: transparent;
  color: var(--pri);
  border: 1.5px solid var(--pri);
  box-shadow: none;
}

button.r {
  background: linear-gradient(135deg, #f87171, #dc2626);
  box-shadow: 0 6px 16px rgba(220, 38, 38, 0.25);
}

/* Form elements */
input, select, textarea {
  font: inherit;
  width: 100%;
  padding: 13px 15px;
  border-radius: 16px;
  border: 1.5px solid var(--bd);
  background: var(--card);
  color: var(--tx);
  margin: 5px 0;
  outline: 0;
  transition: border-color 0.2s, box-shadow 0.2s;
}

input:focus, select:focus, textarea:focus {
  border-color: var(--pri);
  box-shadow: 0 0 0 4px var(--pri-soft);
}

/* Bottom Navigation */
nav {
  position: fixed;
  bottom: 14px;
  left: 14px;
  right: 14px;
  max-width: 532px;
  margin: auto;
  display: flex;
  background: var(--card);
  border-radius: 26px;
  box-shadow: var(--sh-lg);
  padding: 8px;
  border: 1px solid var(--bd);
  margin-bottom: env(safe-area-inset-bottom, 0px);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}

nav a {
  flex: 1;
  text-align: center;
  font-size: 11px;
  color: var(--mut);
  cursor: pointer;
  padding: 9px 4px;
  border-radius: 20px;
  transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
  font-weight: 500;
}

nav a svg {
  display: block;
  margin: 0 auto 4px;
  transition: transform 0.25s;
}

nav a.on {
  color: #fff;
  background: linear-gradient(135deg, var(--pri), var(--pri2));
  font-weight: 700;
  box-shadow: 0 6px 16px rgba(37, 99, 235, 0.3);
}

nav a.on svg {
  transform: scale(1.08);
}

/* Offer box */
.offer {
  display: flex;
  gap: 14px;
  align-items: center;
  background: linear-gradient(135deg, #ecfdf5, #d1fae5);
  color: #065f46;
  border-radius: 20px;
  padding: 15px;
  margin-bottom: 14px;
  font-size: 14px;
  border: 1px solid #a7f3d0;
  box-shadow: 0 4px 16px rgba(5, 150, 105, 0.1);
}

.offer .tile {
  width: 46px;
  height: 46px;
  border-radius: 15px;
  margin: 0;
  flex: none;
  background: linear-gradient(145deg, #34d399, #059669);
}

/* Chips */
.chips {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 4px 0 12px;
  scrollbar-width: none;
}

.chips::-webkit-scrollbar { display: none; }

.chips button {
  white-space: nowrap;
  background: var(--card);
  color: var(--tx);
  border: 1.5px solid var(--bd);
  box-shadow: none;
  padding: 9px 16px;
  font-weight: 500;
}

.chips .on {
  background: linear-gradient(135deg, var(--pri), var(--pri2));
  color: #fff;
  border: 0;
  box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
}

/* Tiers */
.silver { --t: #94a3b8; }
.gold { --t: #d97706; }
.diamond { --t: #9333ea; }

.tier {
  border: 2px solid var(--t);
  position: relative;
}

.tier h3 {
  color: var(--t);
  margin: 0 0 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.mut {
  color: var(--mut);
  font-size: 13px;
}

.badge {
  background: var(--pri-soft);
  color: var(--pri);
  border-radius: 20px;
  padding: 4px 12px;
  font-size: 12px;
  font-weight: 600;
}

/* Doctor card */
.doc {
  display: flex;
  gap: 14px;
}

.doc > svg {
  width: 64px;
  height: 64px;
  flex: none;
  border-radius: 50%;
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12);
}

.doc > div { flex: 1; }

.ver {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  color: #059669;
  font-size: 12px;
  font-weight: 500;
}

/* Table */
table {
  width: 100%;
  border-collapse: collapse;
}

td, th {
  padding: 10px 8px;
  border-bottom: 1px solid var(--bd);
  text-align: center;
  font-size: 13px;
}

th {
  color: var(--mut);
  font-weight: 600;
}

h3 {
  margin: 22px 0 12px;
  font-size: 17px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
}

h3 svg { color: var(--pri); }

/* Dark mode offer adjustment */
:root[data-theme="dark"] .offer,
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .offer {
    background: linear-gradient(135deg, #064e3b, #065f46);
    color: #a7f3d0;
    border-color: #047857;
  }
}

/* ===== Home v2 ===== */
.hx-hi{display:flex;align-items:center;gap:12px;margin:2px 2px 16px}
.hx-av{width:48px;height:48px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:800;font-size:19px;background:linear-gradient(145deg,#60a5fa,#2563eb);box-shadow:0 8px 18px rgba(37,99,235,.3)}
.hx-hi small{display:block;color:var(--mut);font-size:12.5px}
.hx-hi b{font-size:17px}
.hero{padding:26px 20px 34px;border-radius:28px}
.hx-hero-t{font-size:23px;font-weight:800;line-height:1.55;margin:4px 0 6px}
.hx-hero-s{opacity:.86;font-size:13.5px;margin-bottom:18px;max-width:82%}
.hx-cta{background:#fff;color:#1d4ed8;box-shadow:0 8px 20px rgba(0,0,0,.18);padding:12px 22px;border-radius:16px}
.hx-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 16px}
.hx-st{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:12px 6px;text-align:center;box-shadow:var(--sh)}
.hx-st b{display:block;font-size:16px;margin-bottom:2px}
.hx-st span{color:var(--mut);font-size:11.5px}
.hxq .grid{grid-template-columns:repeat(4,1fr);gap:10px}
.hxq .q{padding:14px 4px;font-size:12px;line-height:1.55;border-radius:20px}
.hxq .tile{width:46px;height:46px;border-radius:16px;margin-bottom:8px}
.tile.t4{background:linear-gradient(145deg,#fbbf24,#d97706);box-shadow:0 10px 20px rgba(217,119,6,.3)}
.hx-sec{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 12px}
.hx-sec h3{margin:0}
.hx-sec a{color:var(--pri);font-size:13px;font-weight:600;cursor:pointer}
.hx-scroll{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 14px;scroll-snap-type:x mandatory;scrollbar-width:none}
.hx-scroll::-webkit-scrollbar{display:none}
.hx-doc{flex:none;width:138px;scroll-snap-align:start;background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:14px 10px;text-align:center;box-shadow:var(--sh);cursor:pointer}
.hx-doc:active{transform:scale(.97)}
.hx-doc>svg,.hx-doc>img{width:64px;height:64px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 8px}
.hx-doc b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hx-doc span{display:block;color:var(--mut);font-size:12px;margin:2px 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hx-doc em{font-style:normal;font-size:12px;color:var(--pri);font-weight:700}
.hx-bk{display:flex;gap:12px;align-items:center;border-inline-start:4px solid var(--pri)}
.hx-bk .bi{width:42px;height:42px;border-radius:14px;background:var(--pri-soft);color:var(--pri);display:grid;place-items:center;flex:none}
.hx-bk b{display:block}
.hx-tip{display:flex;gap:12px;align-items:center;background:var(--pri-soft);border-color:transparent;box-shadow:none}
.brand img{width:46px;height:46px;border-radius:12px;filter:drop-shadow(0 6px 12px rgba(37,99,235,.35))}
.auth-logo img{width:78px;height:78px;border-radius:18px;filter:drop-shadow(0 8px 18px rgba(0,0,0,.3))}
</style>

const tier = () => S.tier && S.exp > Date.now() ? S.tier : null;
const days = () => Math.max(0, Math.ceil((S.exp - Date.now()) / DAY));
const offerLeft = () => S.first && !S.second ? S.first + OFFER_DAYS * DAY - Date.now() : 0;

function theme() {
  if (S.theme) document.documentElement.dataset.theme = S.theme;
}

function go(t) {
  S.tab = t;
  save();
  draw();
  m.scrollTop = 0;
}

function draw() {
  const T = [
    ['home', 'home', 'خانه'],
    ['svc', 'grid', 'خدمات'],
    ['ai', 'heart', 'مشاوره'],
    ['visit', 'cal', 'نوبت‌ها'],
    ['acc', 'user', 'حساب کاربری']
  ];
  n.innerHTML = T.map(x =>
    `<a class="${S.tab == x[0] || ((S.tab == 'adm' || S.tab == 'dpanel') && x[0] == 'acc') ? 'on' : ''}" onclick="go('${x[0]}')">${ic(x[1], 23)}${x[2]}</a>`
  ).join('');
  m.innerHTML = hdr() + ({ home, svc, visit, acc, adm, kyc, dpanel, ai: aiTab })[S.tab]();
}

function hdr() {
  return `<div class="top">

  </div>`;
}

function offerBox() {
  const l = offerLeft();
  if (l <= 0) return '';
  const d = Math.floor(l / DAY);
  const h = Math.floor(l % DAY / 36e5);
  return `<div class="offer">
    <div class="tile">${ic('gift', 24)}</div>
    <div>
      <b>${fa(OFFER_PCT)}٪ تخفیف ویزیت دوم</b>
      <div style="font-size:13px;opacity:.9">فقط ${fa(d)} روز و ${fa(h)} ساعت دیگر مهلت دارید</div>
    </div>
  </div>`;
}

    ${S.role == 'doctor' ? '' : `<div class="hx-stats">
      <div class="hx-st"><b>${fa(S.coins)}</b><span>سکه شما</span></div>
      <div class="hx-st"><b>${t ? fa(days()) + ' روز' : '—'}</b><span>${t ? 'اشتراک ' + TIERS[t].n : 'بدون اشتراک'}</span></div>
      <div class="hx-st"><b>${fa(S.bk.length)}</b><span>نوبت ثبت‌شده</span></div>

    <div class="hx-scroll">${top.map(([d, i]) =>
      `<div class="hx-doc" onclick="hxDoc(${i})">${docAv(d, i)}<b>${esc(d[0])}</b><span>${esc(d[1])}</span><em>${d[6] ? '★ ' + fa(d[5]) : fa(d[2]) + ' هزار تومان'}</em></div>`
    ).join('')}</div>` : ''}
    <div class="hx-sec"><h3>${ic('cal', 20)} آخرین نوبت‌ها</h3>${S.bk.length ? '<a onclick="go(\'visit\')">همه</a>' : ''}</div>
    ${last.length
      ? last.map(b =>
          `<div class="card hx-bk"><div class="bi">${ic('cal', 20)}</div><div><b>${esc(b.doc)}</b><div class="mut">${esc(b.when)} · ${esc(b.kind)}</div></div></div>`
        ).join('')

      <div class="mut" style="flex:1">${S.role == 'doctor' ? 'از «پنل پزشک» می‌توانید اطلاعات و نوشته‌های خود را مدیریت کنید.' : 'برای تخفیف ویزیت می‌توانید اشتراک ویژه تهیه کنید.'}</div>

function order(id) {
  const s = S.secs.find(x => x.id == id);
  S.orders.push({
    sid: id, t: s.t,
    note: document.getElementById('note' + id).value,
    when: new Date().toLocaleDateString('fa-IR'),
    price: s.price
  });
  save();
  alert('سفارش شما ثبت شد.');
  draw();
}

function bestPct() {
  const sub = tier() ? TIERS[tier()].disc : 0;
  const off = offerLeft() > 0 ? OFFER_PCT : 0;
  return { pct: Math.max(sub, off), off: off > sub };
}

function visit() {
  const { pct, off } = bestPct();
  const SP = ['همه', ...new Set(S.docs.map(d => d[1]))];
  const list = S.docs.map((d, i) => [d, i])
    .filter(([d]) => (S.spec == 'همه' || d[1] == S.spec) && (d[0] + d[1]).includes(S.q));

  return `<h3>${ic('steth', 20)} ویزیت گرفتن</h3>
    ${offerBox()}
    <input placeholder="جست‌وجوی پزشک یا تخصص" value="${esc(S.q)}" oninput="S.q=this.value;draw2()" id="sq">
    <div class="chips" style="margin-top:10px">${SP.map(s =>
      `<button class="${S.spec == s ? 'on' : ''}" onclick="S.spec='${esc(s)}';draw()">${esc(s)}</button>`
    ).join('')}</div>
    ${list.map(([d, i]) => {
      const p = d[2] * (100 - pct) / 100;
      return `<div class="card">
        <div class="doc">

            <div class="mut" style="margin-top:4px">
              ${pct ? `<s>${fa(d[2])}</s> ` : ''}
              <b style="color:var(--tx)">${fa(p)}</b> هزار تومان
              ${pct ? ` · ${fa(pct)}٪ تخفیف${off ? ' ویزیت دوم' : ''}` : ''}
            </div>
          </div>
        </div>
        <div class="row" style="margin-top:14px">
          <select id="k${i}"><option>حضوری</option><option>مشاوره آنلاین</option></select>
          <select id="w${i}">${slots()}</select>
        </div>
        <button style="width:100%;margin-top:10px" onclick="book(${i})">${ic('cal', 18)} رزرو نوبت</button>
      </div>`;
    }).join('') || '<div class="card mut">پزشکی یافت نشد.</div>'}
    <h3>${ic('list', 20)} نوبت‌های من</h3>
    ${S.bk.map((b, i) =>
      `<div class="card row">
        <div>
          <b>${esc(b.doc)}</b>
          <div class="mut">${esc(b.when)} · ${esc(b.kind)} · ${fa(b.price)} هزار تومان</div>

    ).join('') || '<div class="card mut">نوبتی ندارید.</div>'}

      ? `<h3>${ic('list', 20)} سفارش‌های من</h3>` +

          `<div class="card"><b>${esc(o.t)}</b> <span class="mut">${esc(o.when)}</span><div class="mut">${esc(o.note)}</div></div>`
        ).join('')
      : ''}`;
}

function draw2() {
  const p = document.getElementById('sq').selectionStart;
  draw();
  const g = document.getElementById('sq');
  g.focus();
  g.setSelectionRange(p, p);
}

function slots() {
  let o = '';
  for (let d = 1; d <= 3; d++) {
    const t = new Date(Date.now() + d * DAY).toLocaleDateString('fa-IR', { weekday: 'long', day: 'numeric', month: 'long' });
    ['۱۰:۰۰', '۱۶:۰۰', '۱۸:۳۰'].forEach(h => o += `<option>${t} ${h}</option>`);
  }
  return o;
}

function book(i) {
  const { pct, off } = bestPct();
  const d = S.docs[i];
  const k = document.getElementById('k' + i).value;
  const w = document.getElementById('w' + i).value;
  S.bk.push({ doc: d[0], kind: k, when: w, price: d[2] * (100 - pct) / 100 });
  if (!S.first) S.first = Date.now();
  else if (off) S.second = true;
  else if (offerLeft() > 0 && S.bk.length >= 2) S.second = true;
  save();
  alert(S.bk.length == 1
    ? `نوبت ثبت شد. ${fa(OFFER_PCT)}٪ تخفیف ویزیت بعدی تا ${fa(OFFER_DAYS)} روز آینده فعال است`
    : 'نوبت شما ثبت شد.');
  draw();
}

`}

function sub(i) {
  const r = TIERS[S.pt].p[i];
  if (S.coins < r[2]) {
    alert('موجودی سکه کافی نیست.');
    return;
  }
  S.coins -= r[2];
  const base = tier() == S.pt ? S.exp : Date.now();
  S.tier = S.pt;
  S.exp = base + r[0] * DAY;
  save();
  alert('اشتراک فعال شد');
  draw();
}

  const p = prompt('رمز مدیر را وارد کنید (پیش‌فرض: 1234)');
  if (p === S.pin) {

    draw();
  } else if (p !== null) {
    alert('رمز اشتباه است.');

}

function readImg(f){return new Promise((ok,no)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=240;const x=c.getContext('2d'),s=Math.min(im.width,im.height);x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,240,240);ok(c.toDataURL('image/jpeg',.8))};im.onerror=no;im.src=fr.result};fr.onerror=no;fr.readAsDataURL(f)})}

let AR='patient',AKEEP={},DP=[],PH2=null;
const jyNow=()=>{try{const y=parseInt(new Date().toLocaleDateString('en-US-u-ca-persian-nu-latn',{year:'numeric'}),10);if(y>1300&&y<1700)return y}catch(e){}return new Date().getFullYear()-621};
const jLeap=y=>[1,5,9,13,17,22,26,30].includes(y%33);
function birthParse(v){
 const s=lat(v).replace(/[-.\\\/،,]+/g,'/'),p=s.split('/');
 if(p.length!=3||p.some(x=>!/^\d+$/.test(x)))return null;
 const y=+p[0],m=+p[1],d=+p[2];
 if(p[0].length!=4||y<1300||y>jyNow()||m<1||m>12||d<1)return null;
 const mx=m<=6?31:m<=11?30:(jLeap(y)?30:29);
 if(d>mx)return null;
 return `${y}/${String(m).padStart(2,'0')}/${String(d).padStart(2,'0')}`;
}

function mdLite(t){
 const out=[];let ul=false;
 for(const raw of String(t).split('\n')){
  let l=esc(raw.trim()).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  if(!l){if(ul){out.push('</ul>');ul=false}continue}
  const h=l.match(/^#{1,4}\s*(.+)$/);
  if(h){if(ul){out.push('</ul>');ul=false}out.push(`<h4 style="margin:14px 0 4px;color:var(--pri)">${h[1]}</h4>`);continue}
  const li=l.match(/^[-•*]\s+(.+)$/);
  if(li){if(!ul){out.push('<ul style="margin:4px 0;padding:0 18px 0 0;line-height:1.9">');ul=true}out.push(`<li>${li[1]}</li>`);continue}
  if(ul){out.push('</ul>');ul=false}out.push(`<p style="margin:6px 0;line-height:1.9">${l}</p>`)}
 if(ul)out.push('</ul>');return out.join('')}

 <div class="row" style="margin-top:10px"><span class="mut">${AIC.used&&AIC.limit&&AIC.limit<10000?fa(AIC.used)+' از '+fa(AIC.limit)+' پرسش امروز':''}</span><button class="g" style="padding:6px 12px" onclick="aiNew()">مشاوره‌ی جدید</button></div>
 ${AIC.step==3&&AIC.hist.length>=2?`<button class="g" style="width:100%;margin-top:10px" onclick="go('visit')">${ic('cal',17)} گرفتن ویزیت با پزشک</button>`:''}`}
function aiPaint(){draw();const e=document.getElementById('ci');if(e&&!AIC.busy)e.focus();m.scrollTop=m.scrollHeight}
function aiNew(){aiReset();aiPaint();m.scrollTop=0}
async function aiSend(){
 if(AIC.busy)return;
 const el=document.getElementById('ci');if(!el)return;
 const v=(el.value||'').trim();if(!v)return;
 const st=AIC.step;
 if(st==0){
  if(v.length<4){alert('مشکل را کمی کامل‌تر بنویسید');return}
  AIC.msgs.push({r:'me',t:v});AIC.hist.push({role:'user',content:v});
  AIC.msgs.push({r:'bot',t:'ممنون. بیمار چند سال دارد؟ (فقط عدد، مثلاً ۱۴)'});AIC.step=1;aiPaint();return}
 if(st==1){
  const a=+lat(v);if(!Number.isInteger(a)||a<1||a>120){alert('سن را فقط با عدد بنویسید (۱ تا ۱۲۰)');return}
  AIC.age=a;AIC.msgs.push({r:'me',t:fa(a)+' سال'});
  AIC.msgs.push({r:'bot',t:'کد ملی بیمار را وارد کنید (۱۰ رقم). این کد فقط برای ثبت پرونده‌ی مشاوره نگه‌داری می‌شود و برای هوش مصنوعی ارسال نمی‌شود.'});AIC.step=2;aiPaint();return}
 if(st==2){
  const c=lat(v);if(!nidOk(c)){alert('کد ملی معتبر نیست؛ دوباره بررسی کنید');return}
  AIC.nid=c;AIC.msgs.push({r:'me',t:(c.slice(0,3)+'****'+c.slice(7)).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d])});AIC.step=3;
  if(AIC.age<18)AIC.msgs.push({r:'bot',t:'چون سن بیمار زیر ۱۸ سال است، بهتر است والدین هم در جریان باشند.',w:1});
  return aiAsk()}
 AIC.msgs.push({r:'me',t:v});AIC.hist.push({role:'user',content:v});return aiAsk()}
async function aiAsk(){
 AIC.busy=true;aiPaint();
 let err='';
 try{
  const r=await fetch(SB+'/functions/v1/medura-doctor',{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY,Authorization:'Bearer '+KEY},body:JSON.stringify({token:TOK,age:AIC.age,nid:AIC.hist.length==1?AIC.nid:undefined,msgs:AIC.hist.slice(-13)})});
  const j=await r.json().catch(()=>({}));
  if(r.ok&&j.answer){AIC.msgs.push({r:'bot',t:j.answer,ai:1});AIC.hist.push({role:'assistant',content:j.answer});AIC.used=j.used;AIC.limit=j.limit}
  else err=r.status==404?'سرویس هوش مصنوعی هنوز فعال نشده است.':(DERR[j.error]||'پاسخی دریافت نشد؛ کمی بعد دوباره تلاش کنید.');
 }catch(e){err='اتصال به سرور برقرار نشد.'}
 if(err){if(AIC.hist.length&&AIC.hist[AIC.hist.length-1].role=='user')AIC.hist.pop();AIC.msgs.push({r:'bot',t:err+' پیام خود را دوباره بفرستید.',w:1})}
 AIC.busy=false;aiPaint()}

/* ===== Myket payments (in-app billing through the Android bridge) =====
   Needs the APK wrapper to expose window.MedAndroid (see android/README.md).
   Every purchase is verified on the server (edge function myket-verify) before coins/subscription are granted. */
const PAY={
  pkg:'com.medura.app', /* must equal the package name registered in Myket */
  coinPacks:[{sku:'coins_50',coins:50,toman:100000},{sku:'coins_100',coins:100,toman:200000},{sku:'coins_250',coins:250,toman:500000}],
  pending:{},busy:false
};
const PERR={bad_input:'درخواست نامعتبر است',bad_sku:'این بسته در حال حاضر فروخته نمی‌شود',unauth:'نشست منقضی شد؛ دوباره وارد شوید',not_verified:'ابتدا احراز هویت را کامل کنید',bad_purchase:'پرداخت شما در مایکت تأیید نشد',payload_mismatch:'این خرید متعلق به حساب دیگری است',token_used:'این پرداخت قبلاً برای حساب دیگری ثبت شده است',myket_unreachable:'ارتباط با مایکت برقرار نشد؛ کمی بعد دوباره تلاش کنید'};
PAY.storeUrl=()=>'https://myket.ir/app/'+PAY.pkg;
PAY.ready=()=>{try{return !!(window.MedAndroid&&window.MedAndroid.isMyketReady())}catch(e){return false}};
PAY.call=function(fn,...a){return new Promise((res,rej)=>{
  const id='r'+Date.now()+Math.random().toString(36).slice(2,7);
  const t=setTimeout(()=>{delete PAY.pending[id];rej(new Error('پاسخی از مایکت دریافت نشد'))},600000);
  PAY.pending[id]=r=>{clearTimeout(t);res(r)};
  try{window.MedAndroid[fn](...a,id)}catch(e){clearTimeout(t);delete PAY.pending[id];rej(e)}})};
window.onMyketResult=function(id,json){const f=PAY.pending[id];if(!f)return;delete PAY.pending[id];let r;try{r=typeof json==='string'?JSON.parse(json):json}catch(e){r={ok:false,message:'پاسخ نامعتبر از مایکت'}}f(r)};
PAY.noMyket=function(){modal(`<div class="row"><b>پرداخت با مایکت</b><button class="g" style="padding:6px 12px" onclick="closeM()">بستن</button></div>
 <p class="mut" style="line-height:1.9">پرداخت درون‌برنامه‌ای فقط در نسخهٔ اندروید مدیورا که از مایکت نصب شده، و با نصب بودن مایکت روی گوشی انجام می‌شود.</p>
 <button style="width:100%" onclick="location.href=PAY.storeUrl()">نصب / به‌روزرسانی از مایکت</button>`)};
PAY.start=async function(sku){
  if(!S.verified)return needKyc();
  if(PAY.busy)return;
  if(!PAY.ready())return PAY.noMyket();
  PAY.busy=true;
  try{
    const r=await PAY.call('purchase',sku,String(S.phone||''));
    if(!r||!r.ok){if(r&&r.code==='cancel')return;throw new Error((r&&r.message)||'پرداخت انجام نشد')}
    await PAY.finish(r);
  }catch(e){fail(e)}finally{PAY.busy=false}
};
PAY.finish=async function(r){
  const res=await fetch(SB+'/functions/v1/myket-verify',{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY,Authorization:'Bearer '+KEY},body:JSON.stringify({token:TOK,sku:r.sku,purchase_token:r.purchaseToken,payload:r.payload||''})});
  const j=await res.json().catch(()=>null);
  if(!res.ok||!j||!j.ok)throw new Error(PERR[j&&j.error]||'پرداخت انجام شد اما تأیید آن کامل نشد؛ با باز کردن دوبارهٔ برنامه، خودکار پیگیری می‌شود');
  try{await PAY.call('consume',r.purchaseToken)}catch(e){}
  await sync();
  alert(j.kind==='sub'?'پرداخت موفق بود؛ اشتراک شما فعال شد':'پرداخت موفق بود؛ سکه‌ها به حساب شما اضافه شد');
};
/* purchases that were paid but not yet credited (app closed, network lost…) */
PAY.recover=async function(){
  if(!TOK||!PAY.ready()||PAY.busy)return;
  try{const r=await PAY.call('queryPurchases');for(const p of ((r&&r.purchases)||[])){try{await PAY.finish(p)}catch(e){}}}catch(e){}
};
PAY.openCoins=function(){
  if(!S.verified)return needKyc();
  modal(`<div class="row"><b>خرید سکه</b><button class="g" style="padding:6px 12px" onclick="closeM()">بستن</button></div>
  <div class="mut" style="margin:6px 0">پرداخت امن از طریق مایکت</div>`+PAY.coinPacks.map(p=>`<div class="card row" style="margin:10px 0 0"><div><b>${fa(p.coins)} سکه</b><div class="mut">${fa(p.toman)} تومان</div></div><button onclick="closeM();PAY.start('${p.sku}')">پرداخت</button></div>`).join(''))};
PAY.buySub=function(i){const r=TIERS[S.pt].p[i];PAY.start('sub_'+S.pt+'_'+r[0])};
theme();
draw();
if(TOK)sync().then(()=>PAY.recover()).catch(fail);
</script>
